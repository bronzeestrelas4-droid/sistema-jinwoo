  <style>
    :root {
      --bg-dark: #040914;
      --panel-bg: rgba(8, 20, 42, 0.92);
      --border-glow: #00d8ff;
      --border-dim: rgba(0, 216, 255, 0.35);
      --text-main: #e6f7ff;
      --text-muted: #7aa6c2;
      --accent: #00e5ff;
      --danger: #ff3b5c;
      --success: #00ff9d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      background-image:
        radial-gradient(circle at 50% 0%, rgba(0, 162, 255, 0.16), transparent 60%),
        linear-gradient(rgba(0, 216, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 216, 255, 0.03) 1px, transparent 1px);
      background-size: 100% 100%, 24px 24px, 24px 24px;
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      padding: 16px 14px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .system-window {
      background: var(--panel-bg);
      border: 1.5px solid var(--border-glow);
      box-shadow: 0 0 18px rgba(0, 216, 255, 0.25), inset 0 0 20px rgba(0, 140, 255, 0.12);
      border-radius: 6px;
      padding: 16px;
      position: relative;
      overflow: hidden;
    }

    .system-window::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
    }

    .window-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-dim);
      padding-bottom: 10px;
      margin-bottom: 14px;
    }

    .window-title {
      font-size: 0.92rem;
      font-weight: 800;
      letter-spacing: 2px;
      color: var(--accent);
      text-shadow: 0 0 8px rgba(0, 229, 255, 0.6);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge {
      font-size: 0.72rem;
      padding: 2px 8px;
      border: 1px solid var(--accent);
      border-radius: 3px;
      color: var(--accent);
      background: rgba(0, 229, 255, 0.1);
      font-weight: 700;
    }

    .player-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 12px;
    }

    .level-box {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .level-label {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 700;
      letter-spacing: 1px;
    }

    .level-num {
      font-size: 2.2rem;
      font-weight: 900;
      color: #ffffff;
      text-shadow: 0 0 14px rgba(0, 229, 255, 0.8);
      line-height: 1;
    }

    .rank-info {
      text-align: right;
    }

    .rank-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--accent);
    }

    .rank-sub {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .xp-wrapper {
      margin-bottom: 16px;
    }

    .xp-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 5px;
      font-weight: 600;
    }

    .xp-bar-bg {
      width: 100%;
      height: 10px;
      background: rgba(0, 20, 40, 0.9);
      border: 1px solid var(--border-dim);
      border-radius: 3px;
      overflow: hidden;
    }

    .xp-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #0077ff, #00e5ff);
      box-shadow: 0 0 10px var(--accent);
      transition: width 0.35s ease;
    }

    .points-banner {
      background: rgba(0, 229, 255, 0.12);
      border: 1px dashed var(--accent);
      border-radius: 4px;
      padding: 8px 10px;
      margin-bottom: 12px;
      font-size: 0.8rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #fff;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .stat-item {
      background: rgba(4, 13, 28, 0.75);
      border: 1px solid var(--border-dim);
      border-radius: 4px;
      padding: 9px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .stat-name {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 1px;
    }

    .stat-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .stat-val {
      font-size: 1.05rem;
      font-weight: 800;
      color: #fff;
    }

    .btn-plus {
      background: var(--accent);
      color: #020813;
      border: none;
      width: 22px;
      height: 22px;
      border-radius: 3px;
      font-weight: 900;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .timer-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
